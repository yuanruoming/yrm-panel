name: Build Linux dev release
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: yrm-panel-dev-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate Python, JavaScript, Bash and regression contracts
        run: bash scripts/verify-v1.sh
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Verify real Linux file copy behavior
        run: dotnet run --project tests/FileCopySmoke/FileCopySmoke.csproj -c Release
      - name: Build self-contained Linux binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for pair in linux-x64 linux-arm64; do
            dotnet publish YrmPanel/YrmPanel.csproj \
              -c Release -r "$pair" --self-contained true \
              -p:PublishSingleFile=true -p:PublishTrimmed=false \
              -o "publish/$pair"
            mkdir -p "publish/$pair/deployment"
            cp packaging/yrm-panel.service packaging/yrm-panel-firewall-restore.service "publish/$pair/deployment/"
            cp scripts/yrm-panel-samba.py scripts/yrm-panel-storage.py \
              scripts/yrm-panel-power.sh scripts/yrm-panel-update-trigger.sh \
              scripts/yrm-panel-mount.py scripts/yrm-panel-firewall.py \
              "publish/$pair/deployment/"
            cp scripts/update.sh scripts/uninstall.sh "publish/$pair/deployment/"
            (cd "publish/$pair" && tar -czf "../../artifacts/yrm-panel-$pair.tar.gz" .)
            (cd artifacts && sha256sum "yrm-panel-$pair.tar.gz" > "yrm-panel-$pair.tar.gz.sha256")
          done
      - name: Create or update rolling dev release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view dev >/dev/null 2>&1; then
            gh release create dev --prerelease --title 'Development build (rolling)' \
              --notes 'Automated dev build from the primary branch. Not a stable release.'
          fi
          gh release upload dev artifacts/* --clobber
