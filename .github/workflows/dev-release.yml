name: Build Linux dev release
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: yrm-panel-dev-release
  cancel-in-progress: false
jobs:
  # The real-browser E2E must pass before anything reaches the rolling dev
  # release that installed panels update from.
  e2e:
    if: github.ref_name == github.event.repository.default_branch
    uses: ./.github/workflows/ci-e2e.yml
  lifecycle:
    if: github.ref_name == github.event.repository.default_branch
    uses: ./.github/workflows/ci-lifecycle.yml
  publish:
    needs: [e2e, lifecycle]
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate Python, JavaScript, Bash and regression contracts
        run: bash scripts/verify-v1.sh
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Verify real Linux file copy behavior
        run: dotnet run --project tests/FileCopySmoke/FileCopySmoke.csproj -c Release
      - name: Build self-contained Linux binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for pair in linux-x64 linux-arm64; do
            dotnet publish YrmPanel/YrmPanel.csproj \
              -c Release -r "$pair" --self-contained true \
              -p:PublishSingleFile=true -p:PublishTrimmed=false \
              -o "publish/$pair"
            mkdir -p "publish/$pair/deployment"
            cp packaging/yrm-panel.service packaging/yrm-panel-firewall-restore.service "publish/$pair/deployment/"
            cp scripts/yrm-panel-samba.py scripts/yrm-panel-storage.py \
              scripts/yrm-panel-power.sh scripts/yrm-panel-update-trigger.sh \
              scripts/yrm-panel-mount.py scripts/yrm-panel-firewall.py \
              "publish/$pair/deployment/"
            cp scripts/update.sh scripts/uninstall.sh "publish/$pair/deployment/"
            cp scripts/install.sh scripts/release-manifest.sh scripts/verify-release.sh "publish/$pair/deployment/"
            (cd "publish/$pair" && tar -czf "../../artifacts/yrm-panel-$pair.tar.gz" .)
            (cd artifacts && sha256sum "yrm-panel-$pair.tar.gz" > "yrm-panel-$pair.tar.gz.sha256")
          done
      - name: Build and sign the release manifest
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/release-manifest.sh artifacts dev "dev-${GITHUB_SHA::12}" "$GITHUB_SHA" "$(date -u +%FT%TZ)"
          if grep -Eq "^[[:space:]]*'RW" scripts/install.sh; then
            [[ -n "${MINISIGN_SECRET_KEY:-}" ]] || {
              echo 'Release keys are configured but MINISIGN_SECRET_KEY is missing.' >&2; exit 1; }
            command -v minisign >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y minisign; }
            keyfile="$RUNNER_TEMP/minisign.key"
            printf '%s' "$MINISIGN_SECRET_KEY" > "$keyfile"
            chmod 0600 "$keyfile"
            minisign -S -s "$keyfile" -m artifacts/release.json -x artifacts/release.json.minisig
            rm -f "$keyfile"
            bash scripts/verify-release.sh artifacts/release.json artifacts \
              "$(grep -Eo "RW[A-Za-z0-9+/=]{40,}" scripts/install.sh | head -n 1)"
          else
            echo 'No release public keys are configured; publishing checksum-only assets.'
            bash scripts/verify-release.sh artifacts/release.json artifacts
          fi
      - name: Create or update rolling dev release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view dev >/dev/null 2>&1; then
            gh release create dev --prerelease --title 'Development build (rolling)' \
              --notes 'Automated dev build from the primary branch. Not a stable release.'
          fi
          gh release upload dev artifacts/* --clobber
