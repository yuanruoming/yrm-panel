name: Build Linux dev release
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: yrm-panel-dev-release
  cancel-in-progress: false
jobs:
  publish:
    # Only the repository's selected default branch may replace the rolling dev release.
    # This prevents old main/master branches from overwriting each other's builds.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build self-contained Linux binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for pair in 'linux-x64' 'linux-arm64'; do
            dotnet publish YrmPanel/YrmPanel.csproj \
              -c Release -r "$pair" --self-contained true \
              -p:PublishSingleFile=true -p:PublishTrimmed=false \
              -o "publish/$pair"
            mkdir -p "publish/$pair/deployment"
            cp packaging/yrm-panel.service "publish/$pair/deployment/"
            cp scripts/yrm-panel-samba.py scripts/yrm-panel-power.sh "publish/$pair/deployment/"
            cp scripts/update.sh "publish/$pair/deployment/"
            cp scripts/uninstall.sh "publish/$pair/deployment/"
            (cd "publish/$pair" && tar -czf "../../artifacts/yrm-panel-$pair.tar.gz" .)
            (cd artifacts && sha256sum "yrm-panel-$pair.tar.gz" > "yrm-panel-$pair.tar.gz.sha256")
          done
      - name: Create or update rolling dev release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view dev >/dev/null 2>&1; then
            gh release create dev --prerelease --title 'Development build (rolling)' \
              --notes 'Automated dev build from the primary branch. Not a stable release.'
          fi
          gh release upload dev artifacts/* --clobber
