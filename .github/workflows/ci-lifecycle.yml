name: CI install / upgrade / rollback / uninstall
# Runs the repository's real install.sh and uninstall.sh as root on a disposable
# Ubuntu runner, against locally built release tarballs (no downloads). It checks
# a first install, a good upgrade, a failed upgrade that must roll back helpers,
# sudoers and program together, and uninstall/purge. Never publishes a release.
on:
  push:
    branches-ignore: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:
concurrency:
  group: yrm-panel-lifecycle-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish the x64 build exactly like the release workflow
        run: |
          dotnet publish YrmPanel/YrmPanel.csproj -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=true -p:PublishTrimmed=false -o publish/linux-x64
      - name: Install release verification tooling
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Run the lifecycle test as root
        run: sudo bash tests/lifecycle/lifecycle.sh publish/linux-x64
      - name: Service log (on failure)
        if: failure()
        run: sudo journalctl -u yrm-panel --no-pager -n 120 || true
