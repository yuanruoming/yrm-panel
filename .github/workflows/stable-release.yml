name: Build signed-off stable release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Verify source contracts and Linux file operations
        run: bash scripts/verify-v1.sh
      - name: Verify the tag matches the project version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' YrmPanel/YrmPanel.csproj)
          [[ "v$version" == "$GITHUB_REF_NAME" ]] || { echo 'Version/tag mismatch' >&2; exit 1; }
      - name: Publish Linux x64 and ARM64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for target in linux-x64 linux-arm64; do
            dotnet publish YrmPanel/YrmPanel.csproj -c Release -r "$target" --self-contained true \
              -p:PublishSingleFile=true -p:PublishTrimmed=false -o "publish/$target"
            mkdir -p "publish/$target/deployment"
            cp packaging/yrm-panel.service packaging/yrm-panel-firewall-restore.service "publish/$target/deployment/"
            cp scripts/yrm-panel-samba.py scripts/yrm-panel-storage.py \
              scripts/yrm-panel-power.sh scripts/yrm-panel-update-trigger.sh \
              scripts/yrm-panel-mount.py scripts/yrm-panel-firewall.py \
              "publish/$target/deployment/"
            cp scripts/update.sh scripts/uninstall.sh "publish/$target/deployment/"
            cp scripts/install.sh scripts/release-manifest.sh scripts/verify-release.sh "publish/$target/deployment/"
            (cd "publish/$target" && tar -czf "../../artifacts/yrm-panel-$target.tar.gz" .)
            (cd artifacts && sha256sum "yrm-panel-$target.tar.gz" > "yrm-panel-$target.tar.gz.sha256")
          done
      - name: Build and sign the release manifest
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/release-manifest.sh artifacts stable "$GITHUB_REF_NAME" "$GITHUB_SHA" "$(date -u +%FT%TZ)"
          if grep -Eq "^[[:space:]]*'RW" scripts/install.sh; then
            [[ -n "${MINISIGN_SECRET_KEY:-}" ]] || {
              echo 'Release keys are configured but MINISIGN_SECRET_KEY is missing.' >&2; exit 1; }
            command -v minisign >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y minisign; }
            keyfile="$RUNNER_TEMP/minisign.key"
            printf '%s' "$MINISIGN_SECRET_KEY" > "$keyfile"
            chmod 0600 "$keyfile"
            minisign -S -s "$keyfile" -m artifacts/release.json -x artifacts/release.json.minisig
            rm -f "$keyfile"
            bash scripts/verify-release.sh artifacts/release.json artifacts \
              "$(grep -Eo "RW[A-Za-z0-9+/=]{40,}" scripts/install.sh | head -n 1)"
          else
            echo 'No release public keys are configured; publishing checksum-only assets.'
            bash scripts/verify-release.sh artifacts/release.json artifacts
          fi
      - name: Release stable assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --latest \
            --title "YRM PANEL $GITHUB_REF_NAME" \
            --notes 'Stable self-contained Ubuntu/Debian binaries, with SHA256 checksums.'
